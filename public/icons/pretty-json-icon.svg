<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Curly braces -->
  <path
    d="M176 128
       C 144 128, 136 152, 136 184
       L 136 216
       C 136 232, 128 240, 112 248
       C 128 256, 136 264, 136 280
       L 136 312
       C 136 344, 144 368, 176 368"
    fill="none"
    stroke="#22D3EE"
    stroke-width="24"
    stroke-linecap="round"
  />
  <path
    d="M336 128
       C 368 128, 376 152, 376 184
       L 376 216
       C 376 232, 384 240, 400 248
       C 384 256, 376 264, 376 280
       L 376 312
       C 376 344, 368 368, 336 368"
    fill="none"
    stroke="#22D3EE"
    stroke-width="24"
    stroke-linecap="round"
  />

  <!-- JSON tree trunk -->
  <line x1="256" y1="176" x2="256" y2="320"
        stroke="#38BDF8" stroke-width="10" stroke-linecap="round"/>

  <!-- Branches -->
  <line x1="256" y1="208" x2="212" y2="220"
        stroke="#38BDF8" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="248" x2="300" y2="260"
        stroke="#38BDF8" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="288" x2="220" y2="300"
        stroke="#38BDF8" stroke-width="10" stroke-linecap="round"/>

  <!-- Nodes -->
  <!-- string -->
  <circle cx="212" cy="220" r="11" fill="#F97316"/>
  <!-- number -->
  <circle cx="300" cy="260" r="11" fill="#22C55E"/>
  <!-- boolean -->
  <circle cx="220" cy="300" r="11" fill="#6366F1"/>
  <!-- root node -->
  <circle cx="256" cy="176" r="9" fill="#EAB308"/>

  <!-- Small accent dot -->
  <circle cx="372" cy="144" r="8" fill="#F97316"/>
</svg>

